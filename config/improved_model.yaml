task: "3.11"
random_seed: 42

inputs:
  modeling_manifest: data/manifests/modeling_dataset.csv
  baseline_metrics: reports/baseline/baseline_metrics.json

columns:
  patch_id: patch_id
  aoi_id: aoi_id
  feature_patch_path: feature_patch_path
  target: loss_binary
  split: split

features:
  archive_key: features
  channel_names:
    - ndvi_diff
    - ndvi_2018
    - ndvi_2022
    - b02_2018
    - b03_2018
    - b04_2018
    - b08_2018
    - b02_2022
    - b03_2022
    - b04_2022
    - b08_2022
  expected_patch_size: 32
  statistics: [mean, std, min, p10, p25, median, p75, p90, max]
  forbidden_predictor_columns: [loss_fraction, positive_pixels, negative_pixels, loss_binary]

tuning:
  # Each candidate is trained only on train and ranked only on validation.
  selection_metric: pr_auc
  minimum_recall: 0.75
  threshold_grid_points: 1001
  candidates:
    - model: ExtraTreesClassifier
      n_estimators: 600
      max_depth: 18
      min_samples_leaf: 1
      max_features: sqrt
      class_weight: balanced
    - model: ExtraTreesClassifier
      n_estimators: 600
      max_depth: 24
      min_samples_leaf: 2
      max_features: sqrt
      class_weight: balanced
    - model: ExtraTreesClassifier
      n_estimators: 600
      max_depth: null
      min_samples_leaf: 2
      max_features: 0.5
      class_weight: balanced
    - model: ExtraTreesClassifier
      n_estimators: 600
      max_depth: null
      min_samples_leaf: 4
      max_features: sqrt
      class_weight: balanced
    - model: RandomForestClassifier
      n_estimators: 600
      max_depth: 18
      min_samples_leaf: 1
      max_features: sqrt
      class_weight: balanced_subsample
    - model: RandomForestClassifier
      n_estimators: 600
      max_depth: 24
      min_samples_leaf: 2
      max_features: sqrt
      class_weight: balanced_subsample
    - model: RandomForestClassifier
      n_estimators: 600
      max_depth: null
      min_samples_leaf: 2
      max_features: 0.5
      class_weight: balanced_subsample
    - model: RandomForestClassifier
      n_estimators: 600
      max_depth: null
      min_samples_leaf: 4
      max_features: sqrt
      class_weight: balanced_subsample
  n_jobs: -1

quality_gates:
  test_roc_auc_min: 0.90
  test_pr_auc_min: 0.65
  test_recall_min: 0.75

outputs:
  model_artifact: models/improved_tree_ensemble.joblib
  metrics: reports/improved/improved_model_metrics.json
  predictions: reports/improved/improved_model_predictions.csv
  tuning_results: reports/improved/tuning_results.csv
  feature_importance: reports/improved/feature_importance.csv
  validation_summary: data/manifests/improved_model_validation_summary.json
